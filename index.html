<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sans Battle Simulator</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at center, #171717 0%, #050505 65%, #000 100%);
    color: white;
    font-family: "Courier New", monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.game {
    width: min(900px, 95vw);
    min-height: 650px;
    border: 3px solid #444;
    background: #080808;
    box-shadow: 0 0 40px rgba(255,255,255,.08);
    position: relative;
    padding: 20px;
}

/* ================= HEADER ================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #333;
    padding-bottom: 12px;
}

.title {
    font-size: clamp(20px, 4vw, 34px);
    font-weight: bold;
    letter-spacing: 3px;
}

.turn {
    color: #aaa;
}

/* ================= HP ================= */

.hp-area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 20px;
}

.hp-box {
    border: 2px solid #333;
    padding: 10px;
}

.hp-label {
    display: flex;
    justify-content: space-between;
    margin-bottom: 7px;
}

.hp-bar {
    height: 18px;
    background: #222;
    border: 2px solid #555;
}

.hp-fill {
    height: 100%;
    width: 100%;
    transition: width .3s;
}

.player-hp {
    background: #22d65c;
}

.sans-hp {
    background: #e53935;
}

/* ================= ARENA ================= */

.arena {
    height: 310px;
    border: 3px solid #444;
    margin-top: 20px;
    position: relative;
    background:
        linear-gradient(#090909 1px, transparent 1px),
        linear-gradient(90deg, #090909 1px, transparent 1px);
    background-size: 25px 25px;
    overflow: hidden;
}

/* ================= SANS ================= */

.sans {
    position: absolute;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    transition: transform .15s;
}

.head {
    position: absolute;
    width: 70px;
    height: 65px;
    background: #eee;
    border-radius: 45% 45% 48% 48%;
    left: 15px;
    top: 5px;
    box-shadow: inset -8px -8px 0 #aaa;
}

.eye {
    position: absolute;
    width: 13px;
    height: 13px;
    background: #111;
    border-radius: 50%;
    top: 25px;
}

.eye.left {
    left: 18px;
}

.eye.right {
    right: 18px;
}

.mouth {
    position: absolute;
    width: 35px;
    height: 12px;
    border-bottom: 5px solid #111;
    border-radius: 50%;
    left: 18px;
    top: 42px;
}

.body {
    position: absolute;
    width: 55px;
    height: 45px;
    background: #eee;
    left: 23px;
    top: 65px;
    border-radius: 15px 15px 5px 5px;
}

.eye-glow {
    animation: glowEye .25s infinite alternate;
}

@keyframes glowEye {
    from { box-shadow: 0 0 5px #49bfff; }
    to { box-shadow: 0 0 25px #49bfff; }
}

/* ================= ATTACK EFFECT ================= */

.bone {
    position: absolute;
    width: 15px;
    height: 100px;
    background: white;
    border-radius: 5px;
    display: none;
}

.bone.active {
    display: block;
    animation: boneAttack .5s linear;
}

@keyframes boneAttack {
    from {
        bottom: -110px;
    }
    to {
        bottom: 100%;
    }
}

/* ================= LOG ================= */

.log {
    height: 105px;
    overflow-y: auto;
    border: 2px solid #333;
    background: #030303;
    padding: 10px;
    margin-top: 15px;
    font-size: 14px;
}

.log div {
    margin-bottom: 4px;
}

.log .warning {
    color: #ffd740;
}

.log .damage {
    color: #ff5252;
}

.log .good {
    color: #69f0ae;
}

/* ================= CONTROLS ================= */

.controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 15px;
}

button {
    border: 2px solid #777;
    background: #111;
    color: white;
    font-family: inherit;
    font-weight: bold;
    font-size: 18px;
    padding: 15px;
    cursor: pointer;
    transition: .15s;
}

button:hover:not(:disabled) {
    background: #292929;
    transform: translateY(-2px);
    border-color: white;
}

button:active:not(:disabled) {
    transform: scale(.95);
}

button:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.attack {
    border-color: #e53935;
}

.heal {
    border-color: #22d65c;
}

.dodge {
    border-color: #42a5f5;
}

/* ================= OVERLAY ================= */

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.92);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 20;
}

.overlay-content {
    text-align: center;
    width: 90%;
}

.overlay h1 {
    font-size: clamp(32px, 8vw, 70px);
    margin: 0 0 10px;
}

.overlay p {
    color: #aaa;
    margin-bottom: 25px;
}

.start-btn {
    padding: 18px 45px;
    font-size: 22px;
}

/* ================= ANIMATION ================= */

.shake {
    animation: shake .3s;
}

.hit {
    animation: hit .25s;
}

.heal-animation {
    animation: heal .4s;
}

@keyframes shake {
    0%,100% { transform: translate(0); }
    20% { transform: translate(-8px, 4px); }
    40% { transform: translate(8px, -4px); }
    60% { transform: translate(-6px, -3px); }
    80% { transform: translate(5px, 3px); }
}

@keyframes hit {
    50% {
        filter: brightness(4);
        transform: translate(-50%, -50%) scale(1.15);
    }
}

@keyframes heal {
    50% {
        filter: brightness(2);
        transform: translate(-50%, -50%) scale(1.1);
    }
}

/* ================= MOBILE ================= */

@media (max-width: 600px) {
    .game {
        min-height: 100vh;
        width: 100%;
        border: none;
        padding: 12px;
    }

    .arena {
        height: 260px;
    }

    .controls {
        gap: 6px;
    }

    button {
        font-size: 14px;
        padding: 13px 5px;
    }

    .log {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="game" id="game">

    <!-- START SCREEN -->
    <div class="overlay" id="overlay">
        <div class="overlay-content">
            <h1>SANS BATTLE</h1>
            <p>Can you survive?</p>
            <button class="start-btn" onclick="startGame()">START BATTLE</button>
        </div>
    </div>

    <!-- HEADER -->
    <div class="header">
        <div class="title">SANS BATTLE</div>
        <div class="turn">TURN <span id="turn">0</span></div>
    </div>

    <!-- HP -->
    <div class="hp-area">

        <div class="hp-box">
            <div class="hp-label">
                <span>PLAYER</span>
                <span id="playerHPText">100 / 100</span>
            </div>

            <div class="hp-bar">
                <div class="hp-fill player-hp" id="playerHP"></div>
            </div>
        </div>

        <div class="hp-box">
            <div class="hp-label">
                <span>SANS</span>
                <span id="sansHPText">100 / 100</span>
            </div>

            <div class="hp-bar">
                <div class="hp-fill sans-hp" id="sansHP"></div>
            </div>
        </div>

    </div>

    <!-- ARENA -->
    <div class="arena" id="arena">

        <div class="sans" id="sans">

            <div class="head">
                <div class="eye left" id="leftEye"></div>
                <div class="eye right"></div>
                <div class="mouth"></div>
            </div>

            <div class="body"></div>

        </div>

        <div class="bone" id="bone"></div>

    </div>

    <!-- LOG -->
    <div class="log" id="log">
        <div>Press START BATTLE to begin.</div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">

        <button class="attack"
                id="attackBtn"
                onclick="playerAttack()">
            ⚔ ATTACK
        </button>

        <button class="heal"
                id="healBtn"
                onclick="playerHeal()">
            ♥ HEAL
        </button>

        <button class="dodge"
                id="dodgeBtn"
                onclick="playerDodge()">
            ◇ DODGE
        </button>

    </div>

</div>

<script>
/* =====================================================
   GAME VARIABLES
===================================================== */

const MAX_HP = 100;

let playerHP = MAX_HP;
let sansHP = MAX_HP;

let turn = 0;
let heals = 3;
let combo = 0;

let dodgeNext = false;
let gameActive = false;
let busy = false;


/* =====================================================
   AUDIO
===================================================== */

let audioContext;

function sound(type) {

    try {

        if (!audioContext) {
            audioContext = new (window.AudioContext ||
                window.webkitAudioContext)();
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        let frequency = 300;
        let duration = 0.12;

        if (type === "attack") {
            frequency = 180;
        }

        if (type === "damage") {
            frequency = 90;
            duration = .2;
        }

        if (type === "heal") {
            frequency = 550;
            duration = .25;
        }

        if (type === "win") {
            frequency = 700;
            duration = .5;
        }

        if (type === "lose") {
            frequency = 100;
            duration = .6;
        }

        oscillator.frequency.value = frequency;
        oscillator.type = "square";

        gain.gain.setValueAtTime(.05, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime + duration
        );

        oscillator.start();
        oscillator.stop(audioContext.currentTime + duration);

    } catch (e) {}
}


/* =====================================================
   START
===================================================== */

function startGame() {

    playerHP = 100;
    sansHP = 100;

    turn = 0;
    heals = 3;
    combo = 0;
    dodgeNext = false;

    gameActive = true;
    busy = false;

    document.getElementById("overlay").style.display = "none";

    updateUI();

    clearLog();

    log("Sans is waiting...", "");

    setTimeout(() => {
        log("You know the rules. Survive.", "warning");
    }, 500);
}


/* =====================================================
   UI
===================================================== */

function updateUI() {

    document.getElementById("playerHP").style.width =
        playerHP + "%";

    document.getElementById("sansHP").style.width =
        sansHP + "%";

    document.getElementById("playerHPText").textContent =
        `${playerHP} / 100`;

    document.getElementById("sansHPText").textContent =
        `${sansHP} / 100`;

    document.getElementById("turn").textContent = turn;

    document.getElementById("healBtn").textContent =
        `♥ HEAL (${heals})`;
}


function clearLog() {
    document.getElementById("log").innerHTML = "";
}


function log(message, className = "") {

    const logBox = document.getElementById("log");

    const line = document.createElement("div");

    line.textContent = "> " + message;

    if (className) {
        line.className = className;
    }

    logBox.appendChild(line);

    logBox.scrollTop = logBox.scrollHeight;
}


/* =====================================================
   DISABLE BUTTONS
===================================================== */

function setButtons(enabled) {

    document.getElementById("attackBtn").disabled = !enabled;
    document.getElementById("healBtn").disabled =
        !enabled || heals <= 0;

    document.getElementById("dodgeBtn").disabled = !enabled;
}


/* =====================================================
   PLAYER ATTACK
===================================================== */

function playerAttack() {

    if (!gameActive || busy) return;

    busy = true;
    setButtons(false);

    turn++;

    combo++;

    let damage = random(10, 18);

    /* Critical hit */
    if (Math.random() < .12) {

        damage *= 2;

        log(
            "CRITICAL HIT! You hit Sans for " +
            damage + " damage!",
            "good"
        );

        sound("attack");

    } else {

        log(
            "You attacked Sans for " +
            damage + " damage!",
            "good"
        );

        sound("attack");
    }

    sansHP = Math.max(0, sansHP - damage);

    const sans = document.getElementById("sans");

    sans.classList.add("hit");

    setTimeout(() => {
        sans.classList.remove("hit");
    }, 300);

    updateUI();

    if (sansHP <= 0) {

        winGame();
        return;
    }

    setTimeout(sansTurn, 700);
}


/* =====================================================
   HEAL
===================================================== */

function playerHeal() {

    if (!gameActive || busy || heals <= 0) return;

    busy = true;
    setButtons(false);

    turn++;

    heals--;

    const amount = random(16, 25);

    const oldHP = playerHP;

    playerHP = Math.min(MAX_HP, playerHP + amount);

    const actualHeal = playerHP - oldHP;

    log(
        `You recovered ${actualHeal} HP.`,
        "good"
    );

    sound("heal");

    document.getElementById("game")
        .classList.add("heal-animation");

    setTimeout(() => {
        document.getElementById("game")
            .classList.remove("heal-animation");
    }, 400);

    updateUI();

    setTimeout(sansTurn, 700);
}


/* =====================================================
   DODGE
===================================================== */

function playerDodge() {

    if (!gameActive || busy) return;

    busy = true;
    setButtons(false);

    turn++;

    dodgeNext = true;

    combo = 0;

    log(
        "You prepare to dodge the next attack...",
        "good"
    );

    setTimeout(sansTurn, 700);
}


/* =====================================================
   SANS AI
===================================================== */

function sansTurn() {

    if (!gameActive) return;

    /* Warning for special attack */
    const specialChance = Math.random();

    if (specialChance < .25) {

        log(
            "WARNING: Sans is preparing a special attack!",
            "warning"
        );

        setTimeout(() => {
            performSpecialAttack();
        }, 700);

    } else {

        performNormalAttack();
    }
}


/* =====================================================
   NORMAL ATTACK
===================================================== */

function performNormalAttack() {

    if (dodgeNext) {

        dodgeNext = false;

        log(
            "You dodged Sans's attack!",
            "good"
        );

        sound("attack");

        finishTurn();

        return;
    }

    let damage = random(8, 15);

    /* Small difficulty scaling */
    if (turn >= 7) {
        damage += random(0, 3);
    }

    playerTakeDamage(damage);
}


/* =====================================================
   SPECIAL ATTACK
===================================================== */

function performSpecialAttack() {

    if (dodgeNext) {

        dodgeNext = false;

        log(
            "Amazing! You dodged the special attack!",
            "good"
        );

        finishTurn();

        return;
    }

    const special = random(1, 3);

    let damage;

    if (special === 1) {

        damage = random(13, 20);

        log(
            "Bones rain down from above!",
            "warning"
        );

    } else if (special === 2) {

        damage = random(15, 22);

        log(
            "Sans unleashes a powerful bone attack!",
            "warning"
        );

        document.getElementById("leftEye")
            .classList.add("eye-glow");

        setTimeout(() => {
            document.getElementById("leftEye")
                .classList.remove("eye-glow");
        }, 800);

    } else {

        damage = random(12, 19);

        log(
            "Gaster energy surrounds you!",
            "warning"
        );
    }

    playerTakeDamage(damage);
}


/* =====================================================
   DAMAGE
===================================================== */

function playerTakeDamage(damage) {

    playerHP = Math.max(0, playerHP - damage);

    log(
        `Sans attacked you for ${damage} damage!`,
        "damage"
    );

    sound("damage");

    const game = document.getElementById("game");

    game.classList.add("shake");

    setTimeout(() => {
        game.classList.remove("shake");
    }, 300);

    updateUI();

    if (playerHP <= 0) {

        loseGame();
        return;
    }

    finishTurn();
}


/* =====================================================
   FINISH TURN
===================================================== */

function finishTurn() {

    setTimeout(() => {

        if (!gameActive) return;

        if (playerHP <= 30) {

            log(
                "Your HP is dangerously low!",
                "warning"
            );

        } else if (sansHP <= 30) {

            log(
                "Sans looks weak...",
                "warning"
            );
        }

        busy = false;

        updateUI();

        setButtons(true);

    }, 400);
}


/* =====================================================
   WIN
===================================================== */

function winGame() {

    gameActive = false;
    busy = true;

    sound("win");

    setButtons(false);

    showOverlay(
        "YOU WIN!",
        "You defeated Sans in " + turn + " turns.",
        "FIGHT AGAIN"
    );
}


/* =====================================================
   LOSE
===================================================== */

function loseGame() {

    gameActive = false;
    busy = true;

    sound("lose");

    setButtons(false);

    showOverlay(
        "YOU DIED",
        "Sans wins this time...",
        "TRY AGAIN"
    );
}


/* =====================================================
   OVERLAY
===================================================== */

function showOverlay(title, text, buttonText) {

    const overlay = document.getElementById("overlay");

    overlay.innerHTML = `
        <div class="overlay-content">
            <h1>${title}</h1>
            <p>${text}</p>
            <button class="start-btn"
                    onclick="startGame()">
                ${buttonText}
            </button>
        </div>
    `;

    overlay.style.display = "flex";
}


/* =====================================================
   RANDOM
===================================================== */

function random(min, max) {
    return Math.floor(
        Math.random() * (max - min + 1)
    ) + min;
}


/* =====================================================
   KEYBOARD SUPPORT
===================================================== */

document.addEventListener("keydown", function(e) {

    if (!gameActive || busy) return;

    if (e.key === "1") {
        playerAttack();
    }

    if (e.key === "2") {
        playerHeal();
    }

    if (e.key === "3") {
        playerDodge();
    }

});
</script>

</body>
</html>
